// Mixxx: copy of the build.gradle template of Qt 6.9.3 (androiddeployqt),
// with the libaums dependency added. Keep in sync with the Qt template.
buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        //noinspection AndroidGradlePluginVersion
        classpath 'com.android.tools.build:gradle:8.8.0'
    }
}

repositories {
    google()
    mavenCentral()
}

apply plugin: qtGradlePluginType

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    //noinspection GradleDependency
    implementation 'androidx.core:core:1.16.0'
    // USB mass storage access without root (FAT32 in user space), used by
    // org.mixxx.UsbImporter to import Rekordbox USB drives. Apache-2.0.
    implementation 'me.jahnen.libaums:core:0.10.0'
}

android {
    /*******************************************************
     * The following variables:
     * - androidBuildToolsVersion,
     * - androidCompileSdkVersion
     * - qtAndroidDir - holds the path to qt android files
     *                   needed to build any Qt application
     *                   on Android.
     * - qtGradlePluginType - whether to build an app or a library
     *
     * are defined in gradle.properties file. This file is
     * updated by QtCreator and androiddeployqt tools.
     * Changing them manually might break the compilation!
     *******************************************************/

    namespace = androidPackageName
    compileSdkVersion androidCompileSdkVersion
    buildToolsVersion androidBuildToolsVersion
    ndkVersion = androidNdkVersion

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = [qtAndroidDir + '/src', 'src', 'java']
            aidl.srcDirs = [qtAndroidDir + '/src', 'src', 'aidl']
            res.srcDirs = [qtAndroidDir + '/res', 'res']
            resources.srcDirs = ['resources']
            renderscript.srcDirs = ['src']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs']
       }
    }

    tasks.withType(JavaCompile) {
        options.incremental = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        abortOnError = false
    }

    // Install-time asset pack with the stem separation models (created by
    // tools/make_aab.sh); merged into the assets at runtime ("assets:/stems/...").
    if (findProject(':stems_pack') != null) {
        assetPacks = [':stems_pack']
    }

    if (project.hasProperty('uborosSign')) {
        signingConfigs {
            uboros {
                storeFile file(System.getenv('QT_ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('QT_ANDROID_KEYSTORE_STORE_PASS')
                keyAlias System.getenv('QT_ANDROID_KEYSTORE_ALIAS')
                keyPassword System.getenv('QT_ANDROID_KEYSTORE_KEY_PASS')
            }
        }
        buildTypes {
            release {
                signingConfig signingConfigs.uboros
            }
        }
    }

    aaptOptions {
        // Do not compress Qt binary resources file
        noCompress 'rcc'
    }

    defaultConfig {
        resConfig "en"
        // Play Store build (tools/make_aab.sh): applicationId differs from the
        // namespace/Java package (org.mixxx), which stays unchanged.
        if (project.hasProperty('uborosApplicationId'))
            applicationId project.property('uborosApplicationId')
        if (project.hasProperty('uborosVersionCode'))
            versionCode project.property('uborosVersionCode').toInteger()
        if (project.hasProperty('uborosVersionName'))
            versionName project.property('uborosVersionName')
        minSdkVersion qtMinSdkVersion
        targetSdkVersion qtTargetSdkVersion
        ndk.abiFilters = qtTargetAbiList.split(",")
    }
}

// Plugins outside of this tree (cmake/UborosPlugins.cmake writes this file next to
// build.gradle; it is empty without plugins)
if (file('uboros-plugins.gradle').exists())
    apply from: 'uboros-plugins.gradle'
